services:
  db:
    image: postgres:17-alpine
    container_name: ravito-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ravito
      POSTGRES_PASSWORD: ravito
      POSTGRES_DB: ravito
    ports:
      - "5432:5432"
    volumes:
      - ravito-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravito -d ravito"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ravito-pgdata:
